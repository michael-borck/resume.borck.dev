<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Delve — a roguelike CV</title>
<meta name="description" content="A roguelike text dungeon through Michael Borck's career. Descend three depths, fight career monsters, and recover the résumé relics." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070d08'/%3E%3Ctext x='3' y='13' font-size='12' fill='%237dff9e'%3E%3E%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="assets/css/dungeon.css" rel="stylesheet" />
</head>
<body>
<div class="crt">
  <header class="bar">
    <span class="title">THE DELVE</span>
    <span class="sub" id="hud">HP 24/24 · ATK 3 · depth 1/3 · relics 0</span>
    <span class="spacer"></span>
    <button class="mini" id="helpBtn">help</button>
    <button class="mini" id="restartBtn">restart</button>
  </header>

  <main class="stage">
    <div class="mapwrap">
      <pre class="map" id="map" tabindex="0" aria-label="dungeon map — use arrow keys or WASD to move"></pre>
    </div>
    <div class="logwrap">
      <div class="log" id="log" aria-live="polite"></div>
    </div>
  </main>

  <form class="prompt" id="form" autocomplete="off">
    <span class="caret">&gt;</span>
    <input id="cmd" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="command" placeholder="arrows / WASD move · p potion · &gt; descend · ? help · / command" />
  </form>
</div>
<a class="portal-backlink" href="../../index.html">← CV Portal</a>

<div class="overlay hidden" id="won">
  <div class="card">
    <h1 id="overlayTitle">THE DELVE IS SPENT</h1>
    <p id="wonText"></p>
    <button id="againBtn">DELVE AGAIN</button>
  </div>
</div>

<script src="assets/js/dungeon.js"></script>
</body>
</html>
