# Map layout for the Zelda-style Resume World (creative/world/).
# Regions are the overworld areas; each lists the CV keys it draws from and
# where it sits on the pixel-art map (x,y are % of the map image).
# `spawns` caps how many markers are drawn per region, so dense sections
# (e.g. experience) stay readable on the map.
world:
  spawn: { x: 50, y: 50 }
  regions:
    - id: experience
      name: "The Keep"
      subtitle: "A career across military, academia, and industry"
      map: { x: 50, y: 15 }
      icon: keep
      sources: [experience]
      spawns: 8
    - id: education
      name: "The Observatory"
      subtitle: "Five degrees and a doctorate"
      map: { x: 78, y: 78 }
      icon: tower
      sources: [education]
      spawns: 5
    - id: skills
      name: "The Dojo"
      subtitle: "Languages, frameworks, and tools of the trade"
      map: { x: 80, y: 35 }
      icon: dojo
      sources: [skills]
      spawns: 5
    - id: projects
      name: "Treasure Vault"
      subtitle: "Tools and open-source creations"
      map: { x: 72, y: 88 }
      icon: chest
      sources: [projects]
      spawns: 6
    - id: achievements
      name: "Hall of Legends"
      subtitle: "Achievements and recognition"
      map: { x: 28, y: 82 }
      icon: scroll
      sources: [achievements, publications]
      spawns: 6
    - id: teaching
      name: "The Training Grounds"
      subtitle: "Teaching philosophy and student impact"
      map: { x: 24, y: 30 }
      icon: dojo
      sources: [teaching]
      spawns: 4
    - id: service
      name: "The Old Ruins"
      subtitle: "Professional service and community"
      map: { x: 50, y: 86 }
      icon: ruins
      sources: [service, memberships]
      spawns: 4
    - id: interests
      name: "The Far Shore"
      subtitle: "Life beyond work"
      map: { x: 18, y: 80 }
      icon: beach
      sources: [interests]
      spawns: 6

summary:
  main: AI Leader and Cyber Security expert with 35+ years spanning military → academia → industry consulting. Author of the "Learning with AI" open-textbook series (Conversation, Not Delegation; The Human Edge; Speak Software; Model Data, Verify AI, plus domain companions), creator of innovative educational AI tools, and a leader in AI-enhanced pedagogy serving academics, education, agriculture and mining sectors. Founder of LocoLabo, a self-funded applied-AI research lab (12 projects, 52 GPUs, $0 sponsorship) mapping what small local models can do on hardware people already own, with a rare combination of technical depth and educational innovation expertise. Teaching philosophy grounded in three conceptual pillars - Caring, Competence, and Passion, with a core principle of "Make Contact Count."

teaching:
  philosophy:
    core: "Make Contact Count - maximising impact through every student interaction"
    framework: "Built on three pillars - Caring, Competence, and Passion"
    approach: "Grounded in Constructivist learning theory, Bloom's Taxonomy, and Universal Design for Learning (UDL)"
  
  satisfaction:
    - metric: "85.0% average student rating"
      details: "Across 38 unit deliveries since 2019 (eVALUate to 2022, Insight from 2023); all six survey dimensions at or above 80% - Assessments 89.2%, Engagement 86.8%, Expectations 85.5%, Resources 84.9%, Support 81.2%"
    - metric: "16 deliveries at 100%"
      details: "Top results sustained across 8 units, alongside a 12% average pass-rate uplift in AI-redesigned units and a return to 100% in Semester 2 2025 after the 2024 AI transition"
    - metric: "Full-span teaching reach"
      details: "Undergraduate, postgraduate and executive education - a range few academics deliver across - online and on-campus, domestic and international (China), from small specialist classes to cohorts of 300"
  
  feedback:
    - "Michael is an absolute legend, I love his teaching style"
    - "He really did feel like he cared about my learning"
    - "The unit was hard, but fun, because he clearly cared about our learning"
    - "Michael made it easy for me to gain information"
  
  innovations:
    - name: "Cloud Core Simulation"
      description: "Created complete virtual company with IT infrastructure, policies, and staff chatbot for authentic audit experiences"
    - name: "Real-World Integration"
      description: "Students report assessments prepare them for 'workplace environment'"
    - name: "Student Impact"
      description: "The environment created while performing the assignment is nothing less than working in real-time"

achievements:
  - "Teaching Excellence - 85.0% average student rating across 38 unit deliveries since 2019, with 16 deliveries scoring 100% and all six survey dimensions at or above 80%"
  - "Research Funding - Lead Investigator on the AUD $20,000 Curtin Needs-Based Funding (Learning & Teaching) Grant 2026, awarded on an evidence base of 14,973 logged student-AI interactions; technical co-lead on the Assessment 2030 Future Fund (AUD $10,560, 2025)"
  - "Research Outputs - Accepted ACIS 2026 (solo) and ASCILITE 2026 (contributing) papers, with a sustained program of AI-in-education scholarship and invited research seminars"
  - "Course Leadership - Led the repositioning of the Master of Information Systems and Technology into a standalone degree, growing it ~6x to 110 EFTSL (2025) and 148 EFTSL year-to-date (2026); secured Australian Computer Society accreditation"
  - "Curriculum Innovation - Redesigned 8 units for the AI era and built 2 new postgraduate units from scratch, delivering a 12% average pass-rate uplift"
  - "Assessment Innovation - Created CloudCore Networks, selected by Curtin's Assessment 2030 as a Lane 2 (AI-robust) exemplar, and the foundation for WorkReady under the $735,000 WIL-Ignite project"
  - "Executive Education - Designed and delivered 5 AI courses to ~190 participants across 6 sessions (4.3/5 satisfaction), profiled in the Australian Financial Review alongside Bond and Melbourne"
  - "Open Educational Resources - 30+ free apps and the 'Learning with AI' open-textbook series (4 core books + domain companions, 1,400+ monthly downloads); 2 titles adopted as e-readings by Kaplan Business School, and the Curriculum Curator tool adopted as the foundation of FLUX"
  - "Discipline Recognition - Invited to the FBL Advisory Board, the Curtin Future of Work Institute, and the Curtin Festival of AI; peer-reviewer for ACIS since 2023"
  - "Professional Standing - Certified Professional Member of the Australian Computer Society (ACS); led the discipline's accreditation and international articulation (SCNU) agenda"

